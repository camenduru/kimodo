services:
  text-encoder:
    build:
      context: .
      dockerfile: Dockerfile
    image: camenduru/vrmkimodo
    container_name: text-encoder
    working_dir: /workspace
    command: python -m kimodo.scripts.run_text_encoder_server
    # Models are baked into the image at build time; no host mounts are used.
    ports:
      - "9550:9550"
    environment:
      # Models live in the image; never download at runtime.
      - HF_HOME=/opt/hf-cache
      - TEXT_ENCODERS_DIR=/opt/text-encoders
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - LOCAL_CACHE=1

      # GPU
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    shm_size: "16gb"
    ipc: host

    # Wait until Gradio responds on HTTP
    healthcheck:
      test:
        ["CMD", "bash", "-lc", "curl -fsS http://localhost:9550/ > /dev/null"]
      interval: 3s
      timeout: 2s
      retries: 40

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  demo:
    # Reuses the image built by the `text-encoder` service (same Dockerfile).
    # Keeping a single build target avoids building/downloading the image twice.
    image: camenduru/vrmkimodo
    container_name: demo
    working_dir: /workspace
    command: python -m kimodo.demo
    ports:
      - "${SERVER_PORT:-7860}:${SERVER_PORT:-7860}"
    environment:
      # Point the model at the text-encoder service.
      - TEXT_ENCODER_URL=http://text-encoder:9550/
      - SERVER_PORT=${SERVER_PORT:-7860}
      # Models live in the image; never download at runtime.
      - HF_HOME=/opt/hf-cache
      - TEXT_ENCODERS_DIR=/opt/text-encoders
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - LOCAL_CACHE=1

      # GPU
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    shm_size: "16gb"
    ipc: host

    depends_on:
      text-encoder:
        condition: service_healthy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
